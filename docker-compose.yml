version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: postgres_announcements
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-announcements_db}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d announcements_db']
      interval: 5s
      timeout: 5s
      retries: 5
  api:
    build: .
    container_name: announcements_api
    env_file:
      - .env
    environment:
      - PORT=${PORT:-3000}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-announcements_db}?schema=public
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_12345}
    ports:
      - '${PORT:-3000}:${PORT:-3000}'
    depends_on:
      - postgres
    restart: always

volumes:
  postgres_data:
